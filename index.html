<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APEX FITNESS | Become Unstoppable</title>
    <meta name="description" content="Luxury gym and fitness studio. Transform your body with elite trainers and world-class facilities." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              apex: {
                red: '#FF0000',
                orange: '#FF4500',
                gold: '#FFD700',
                black: '#050505',
                dark: '#0f0f0f',
                gray: '#1a1a1a'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Montserrat', 'sans-serif'],
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
              'noise': "url('https://grainy-gradients.vercel.app/noise.svg')",
            },
            animation: {
              'scroll-slow': 'scroll 25s linear infinite',
              'scroll-medium': 'scroll 20s linear infinite',
              'scroll-fast': 'scroll 15s linear infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              scroll: {
                '0%': { transform: 'translateY(0)' },
                '100%': { transform: 'translateY(-50%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 100px;
      }
      body {
        background-color: #000;
        color: #fff;
        overflow-x: hidden;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .glass-nav {
        background: rgba(5, 5, 5, 0.7);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .text-glow {
        text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
      }
      /* Hide scrollbar for clean UI */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0f0f;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF0000;
      }
      
      /* Mobile responsive chat */
      @media (max-width: 640px) {
        #n8n-chat-container {
          bottom: 80px !important;
          right: 10px !important;
          left: 10px !important;
          width: auto !important;
          height: 70vh !important;
          max-height: 500px !important;
        }
        #chat-toggle {
          bottom: 10px !important;
          right: 10px !important;
          width: 56px !important;
          height: 56px !important;
        }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Chat Toggle Button -->
    <button
      id="chat-toggle"
      style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #FF0000, #FF4500);
        border: none;
        cursor: pointer;
        z-index: 9999;
        box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
        transition: transform 0.2s, box-shadow 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      "
      onmouseover="this.style.transform='scale(1.1)'; this.style.boxShadow='0 6px 30px rgba(255, 0, 0, 0.6)';"
      onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 4px 20px rgba(255, 0, 0, 0.4)';"
      onclick="toggleChat()"
      aria-label="Toggle chat"
    >
      💬
    </button>

    <!-- Chat Widget Container -->
    <div
      id="n8n-chat-container"
      style="
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 400px;
        height: 600px;
        max-width: calc(100vw - 40px);
        max-height: calc(100vh - 120px);
        z-index: 9998;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
        background: #0f0f0f;
        opacity: 0;
        transform: translateY(20px) scale(0.95);
        pointer-events: none;
        transition: opacity 0.3s, transform 0.3s;
      "
    >
      <iframe
        id="n8n-chat-iframe"
        src=""
        width="100%"
        height="100%"
        style="border:none; display:block;"
        allow="microphone; camera"
        title="Chat support"
      ></iframe>
    </div>

    <script>
      let chatOpen = false;
      const chatUrl = 'https://opraxai.app.n8n.cloud/webhook/b833199b-6342-4682-88ad-f17c76f55320/chat';
      
      function toggleChat() {
        const container = document.getElementById('n8n-chat-container');
        const iframe = document.getElementById('n8n-chat-iframe');
        const button = document.getElementById('chat-toggle');
        
        chatOpen = !chatOpen;
        
        if (chatOpen) {
          // Load iframe only when opened (better performance)
          if (!iframe.src) {
            iframe.src = chatUrl;
          }
          container.style.opacity = '1';
          container.style.transform = 'translateY(0) scale(1)';
          container.style.pointerEvents = 'auto';
          button.innerHTML = '✕';
          button.style.fontSize = '32px';
        } else {
          container.style.opacity = '0';
          container.style.transform = 'translateY(20px) scale(0.95)';
          container.style.pointerEvents = 'none';
          button.innerHTML = '💬';
          button.style.fontSize = '28px';
        }
      }
      
      // Optional: Close chat when clicking outside
      document.addEventListener('click', function(event) {
        const container = document.getElementById('n8n-chat-container');
        const button = document.getElementById('chat-toggle');
        
        if (chatOpen && !container.contains(event.target) && !button.contains(event.target)) {
          // Uncomment next line if you want chat to close when clicking outside
          // toggleChat();
        }
      });
    </script>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
